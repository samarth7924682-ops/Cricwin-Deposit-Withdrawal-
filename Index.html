<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Master Control</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        h2 { color: #38bdf8; font-size: 18px; margin-bottom: 15px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; outline: none; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0f172a; font-size: 14px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .table-wrap { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; background: #111827; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: left; font-size: 12px; vertical-align: top; }
        th { background: #1f2937; color: #38bdf8; position: sticky; top: 0; }
        
        /* Status Colors */
        .status-success { color: #22c55e; font-weight: bold; }
        .status-pending { color: #fbbf24; font-weight: bold; }
        .status-rejected { color: #ef4444; font-weight: bold; }
        
        .amt { color: #fbbf24; font-weight: bold; font-size: 14px; }
        .qr-thumb { width: 50px; height: 50px; border-radius: 5px; border: 1px solid #38bdf8; cursor: pointer; object-fit: cover; background: #fff; display: block; margin-top: 5px; }
        
        /* Login Overlay */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; width: 300px; }
        #admin-panel { display: none; }
        
        .action-box { background: #111827; padding: 10px; border-radius: 8px; border: 1px solid #334155; margin-top: 5px; }
        .file-label { display: block; background: #334155; padding: 8px; border: 1px dashed #38bdf8; border-radius: 5px; cursor: pointer; text-align: center; font-size: 10px; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="master-pin" placeholder="Enter Master Password">
            <button onclick="unlock()">Unlock Panel</button>
        </div>
    </div>

    <div id="admin-panel">
        <div class="card">
            <h2 id="pin-title">Set/Update User PIN</h2>
            <input type="text" id="sid" placeholder="User ID Name">
            <input type="text" id="spin" placeholder="Enter PIN">
            <button onclick="savePin()">Save / Update PIN</button>
        </div>

        <div class="card">
            <h2>Saved User PINs</h2>
            <div class="table-wrap">
                <table style="min-width: 100%;">
                    <thead>
                        <tr><th>User ID</th><th>Current PIN</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="pin-list"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Requests Logs & Approval Section</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Type/User</th>
                            <th>Amount</th>
                            <th>User Proof</th>
                            <th>Status</th>
                            <th>Admin Action (Status & Proof)</th>
                        </tr>
                    </thead>
                    <tbody id="logs"></tbody>
                </table>
            </div>
            <button class="clear-btn" style="background:#ef4444; color:white;" onclick="delHistory()">Clear All History</button>
        </div>
    </div>

<script>
    // --- SECURITY CONFIG ---
    const MASTER_PASS = "824578"; // <--- Isse apne hisaab se badal lein

    function unlock() {
        if(document.getElementById('master-pin').value === MASTER_PASS) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadData();
        } else { alert("Wrong Password!"); }
    }

    // --- PIN LOGIC ---
    function savePin() {
        let id = document.getElementById('sid').value.trim();
        let pin = document.getElementById('spin').value.trim();
        if(!id || !pin) return alert("Details bhariye!");
        let pins = JSON.parse(localStorage.getItem('admin_pins') || "{}");
        pins[id] = pin;
        localStorage.setItem('admin_pins', JSON.stringify(pins));
        alert("PIN Saved!");
        loadPins();
    }

    function loadPins() {
        let pins = JSON.parse(localStorage.getItem('admin_pins') || "{}");
        let list = document.getElementById('pin-list');
        list.innerHTML = Object.keys(pins).map(id => `
            <tr>
                <td><b>${id}</b></td><td>${pins[id]}</td>
                <td>
                    <button style="width:auto; padding:5px 10px; background:#fbbf24; color:black;" onclick="editPin('${id}','${pins[id]}')">Edit</button>
                    <button style="width:auto; padding:5px 10px; background:#ef4444; color:white;" onclick="deletePin('${id}')">Del</button>
                </td>
            </tr>
        `).join('');
    }

    function editPin(id, pin) {
        document.getElementById('sid').value = id;
        document.getElementById('spin').value = pin;
    }

    function deletePin(id) {
        if(confirm("Delete " + id + "?")) {
            let pins = JSON.parse(localStorage.getItem('admin_pins') || "{}");
            delete pins[id];
            localStorage.setItem('admin_pins', JSON.stringify(pins));
            loadPins();
        }
    }

    // --- REQUEST LOGIC ---
    function loadData() {
        let data = JSON.parse(localStorage.getItem('store_requests') || "[]");
        let list = document.getElementById('logs');
        if(data.length === 0) { list.innerHTML = '<tr><td colspan="6" style="text-align:center;">No requests found</td></tr>'; return; }

        list.innerHTML = data.slice().reverse().map((i, idx) => {
            const realIdx = data.length - 1 - idx;
            let userProof = i.paymentProof ? `<img src="${i.paymentProof}" class="qr-thumb" onclick="window.open(this.src)" title="Payment Screenshot">` : (i.qrImg ? `<img src="${i.qrImg}" class="qr-thumb" onclick="window.open(this.src)">` : "No Proof");
            let sClass = `status-${(i.status || 'pending').toLowerCase()}`;

            return `
            <tr>
                <td>${i.time}</td>
                <td><b>${i.type}</b><br>${i.idName}</td>
                <td class="amt">₹${i.amount}</td>
                <td>${userProof}</td>
                <td class="${sClass}">${i.status || 'Pending'}</td>
                <td>
                    <div class="action-box">
                        <select id="s-${realIdx}">
                            <option value="Pending" ${i.status==='Pending'?'selected':''}>Pending</option>
                            <option value="Success" ${i.status==='Success'?'selected':''}>Success</option>
                            <option value="Rejected" ${i.status==='Rejected'?'selected':''}>Rejected</option>
                        </select>
                        <label class="file-label">
                            <input type="file" id="p-${realIdx}" accept="image/*" style="display:none;" onchange="this.nextElementSibling.innerText='File Ready'">
                            <span>Upload Proof Screenshot</span>
                        </label>
                        <button style="font-size:10px; padding:5px; background:#22c55e; color:white;" onclick="updateReq(${realIdx})">Update</button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    async function updateReq(idx) {
        let data = JSON.parse(localStorage.getItem('store_requests') || "[]");
        data[idx].status = document.getElementById(`s-${idx}`).value;
        
        let f = document.getElementById(`p-${idx}`).files[0];
        if(f) data[idx].adminProof = await toBase64(f);

        localStorage.setItem('store_requests', JSON.stringify(data));
        alert("Status Updated!");
        loadData();
    }

    function toBase64(file) {
        return new Promise((r, j) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => r(reader.result);
            reader.onerror = e => j(e);
        });
    }

    function delHistory() {
        if(confirm("Clear history?")) { localStorage.setItem('store_requests', "[]"); loadData(); }
    }

    loadPins();
    setInterval(loadData, 5000);
</script>
</body>
</html>
